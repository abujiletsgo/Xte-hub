[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "xtesync"
version = "0.1.0"
description = "XteSync - Reading experience & navigation for Xteink e-readers"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "aiosqlite>=0.20",
    "ebooklib>=0.18",
    "httpx>=0.27",
    "anthropic>=0.40",
    "pydantic>=2.0",
    "readability-lxml>=0.8",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
]

[project.scripts]
xtesync = "xtesync.main:cli"

[tool.setuptools.packages.find]
where = ["src"]
